services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/boulet_capital.db
      # Change this to a long random string before exposing the platform
      # beyond your own machine — it signs the login sessions.
      - AUTH_SECRET_KEY=boulet-capital-dev-secret-change-me
      # - SEED_DEMO_DATA=true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
