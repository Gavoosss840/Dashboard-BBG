services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
      # Sauvegardes quotidiennes de la base, écrites directement sur ta machine
      # (dossier backups/ du projet) — elles survivent à un reset Docker.
      - ./backups:/app/backups
    environment:
      - DATABASE_URL=sqlite:////app/data/boulet_capital.db
      - BACKUP_DIR=/app/backups
      # La clé qui signe les sessions est générée automatiquement (aléatoire)
      # au premier démarrage et stockée dans le volume. Décommente uniquement
      # pour imposer ta propre clé :
      # - AUTH_SECRET_KEY=
      # Connexion Interactive Brokers (Flex Web Service) — voir la page
      # "Données & Synchro" de la plateforme pour le guide pas-à-pas.
      # Ces valeurs restent sur TA machine, ne les partage jamais.
      # - IBKR_FLEX_TOKEN=
      # - IBKR_FLEX_QUERY_ID=
      # - SEED_DEMO_DATA=true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
